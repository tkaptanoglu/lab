---
###############################################################################
# Ansible Playbook: Lynis Security Hardening (Role-Based)
# =======================================================
# Target:  Raspberry Pi 4B – Ubuntu 22.04.5 LTS (Kubernetes node)
# Baseline: Lynis 3.1.3 score = 60 / 100
# Goal:    Raise the hardening score as close to 100 as possible WITHOUT
#          breaking:
#            • SSH remote access (Ansible control plane)
#            • Kubernetes services (kubelet, containerd, etcd, kube-proxy,
#              kube-apiserver, kube-controller, kube-scheduler, flannel)
#            • NodePort exposure (iptables / nftables rules)
#
# OUT OF SCOPE (intentionally skipped):
#   - All SSH hardening suggestions (SSH-7408)
#   - Disabling IP forwarding (K8s requires it)
#   - Disabling kernel module loading (K8s loads modules dynamically)
#   - Separate partitions for /home, /tmp, /var (FILE-6310 – not feasible)
#   - Remote syslog (LOGG-2154 – needs external infrastructure)
#   - DNS domain config (NAME-4028 – Tailscale-managed)
#   - Unused iptables rules (FIRE-4513 – K8s-managed)
#   - Lynis version upgrade
###############################################################################

- name: Lynis Security Hardening for Kubernetes Node
  hosts: all
  become: true
  gather_facts: true

  roles:
    # Ensure latest Lynis version
    - role: roles/security/reporting/lynis/upgrade

    # Install and configure security-related packages
    - role: roles/security/package_security
    - role: roles/security/patching/apt_upgrade_daily
      vars:
        server_autopatch_origins:
          - "o=Ubuntu,a=${distro_codename}-security"
          - "o=Ubuntu,a=${distro_codename}-updates"

    # Sysctl kernel parameter hardening and core dump restrictions
    - role: roles/security/kernel_hardening

    # Password policies, hashing, umask, PAM quality
    - role: roles/security/auth_and_passwords

    # File permissions, /tmp hardening, compiler restrictions
    - role: roles/security/filesystem_and_permissions

    # Blacklist unused protocols, disable USB storage
    - role: roles/security/network_hardening

    # auditd, process accounting, sysstat
    - role: roles/security/audit_and_accounting/install
    - role: roles/security/audit_and_accounting/fixup

    # AIDE, rkhunter – file integrity, malware scanning and intrusion monitoring
    - role: roles/security/ids/rkhunter
    - role: roles/security/ids/falco/installation
      vars:
        falco_reinstall_if_present: false
        falco_purge_on_remove: true

        # eBPF-only install path (final working approach on ubuntu-raspi)
        falco_driver_choice: "ebpf"
        falco_install_ebpf_build_deps: true

        # Update rules via falcoctl artifact
        falco_update_rules: true
        falco_rules_artifact: "falco-rules"
        falco_rules_tag: "latest"

        # Services
        falco_service_enabled: true
        falco_service_state: started

        # Optional: background artifact updates (off by default)
        falco_enable_artifact_follow: false
    - role: roles/security/ids/falco/email_alerts_setup

    # Disable unnecessary services, sandbox node_exporter
    - role: roles/security/service_hardening

    # Legal warning banners on /etc/issue and /etc/issue.net
    - role: roles/security/banners_and_warnings

    # Activate pam_pwquality in PAM stack (AUTH-9262)
    - role: roles/security/pam_hardening

    # Tighten home directory permissions (HOME-9304)
    - role: roles/security/home_directory_permissions

    # Configure idle session timeout (SHLL/session_timeout_enabled)
    - role: roles/security/session_timeout

    # Harden Postfix where installed (MAIL-8820)
    - role: roles/security/postfix_hardening

    # Fix residual sysctl values not applied at runtime (KRNL-6000)
    - role: roles/security/sysctl_residual_fix

    # Restart services holding deleted files (LOGG-2190)
    - role: roles/security/deleted_files_cleanup
