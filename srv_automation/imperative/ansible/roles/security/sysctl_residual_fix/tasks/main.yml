---
###############################################################################
# Role: sysctl_residual_fix
# =========================
# Resolves residual KRNL-6000 findings where sysctl values were written
# to our config file but overridden by earlier-loading system defaults.
#
# On Ubuntu 22.04, /usr/lib/sysctl.d/50-default.conf ships with
# fs.protected_fifos=1. Even though our 99-lynis-hardening.conf has
# the higher prefix, the ansible.posix.sysctl module may not reliably
# override it if the value is already set at boot.
#
# Strategy: write to config, force the value at runtime with sysctl -w,
# AND remove conflicting entries from upstream configs.
###############################################################################

# -------------------------------------------------------------------------
# Ensure our config file has the value (idempotent).
# -------------------------------------------------------------------------
- name: "KRNL-6000: Ensure fs.protected_fifos=2 in config"
  ansible.posix.sysctl:
    name: fs.protected_fifos
    value: "2"
    sysctl_file: /etc/sysctl.d/99-lynis-hardening.conf
    reload: false              # We'll reload manually after fixing overrides
    state: present

# -------------------------------------------------------------------------
# Comment out the conflicting line in Ubuntu's default sysctl config.
# This file sets fs.protected_fifos=1 and loads before our 99- file,
# but on reboot or sysctl --system the last-loaded value wins.
# The real problem is that some sysctl implementations apply the FIRST
# value seen rather than the last. Removing the conflict eliminates this.
# -------------------------------------------------------------------------
- name: "KRNL-6000: Neutralise conflicting fs.protected_fifos in 50-default.conf"
  ansible.builtin.replace:
    path: /usr/lib/sysctl.d/50-default.conf
    regexp: '^(fs\.protected_fifos\s*=.*)$'
    replace: '# \1  # Overridden by 99-lynis-hardening.conf'
  ignore_errors: true          # File may not exist on all systems

# -------------------------------------------------------------------------
# Also check /etc/sysctl.d/10-* files which Ubuntu sometimes uses.
# -------------------------------------------------------------------------
- name: "KRNL-6000: Find any other files overriding fs.protected_fifos"
  ansible.builtin.shell: |
    set -euo pipefail
    grep -rl '^fs\.protected_fifos' /etc/sysctl.d/ /usr/lib/sysctl.d/ 2>/dev/null | \
    grep -v '99-lynis-hardening.conf' || true
  args:
    executable: /bin/bash
  register: conflicting_files
  changed_when: false

- name: "KRNL-6000: Comment out fs.protected_fifos in conflicting files"
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(fs\.protected_fifos\s*=.*)$'
    replace: '# \1  # Overridden by 99-lynis-hardening.conf'
  loop: "{{ conflicting_files.stdout_lines }}"
  when: conflicting_files.stdout_lines | length > 0

# -------------------------------------------------------------------------
# Reload the full sysctl stack now that conflicts are removed.
# -------------------------------------------------------------------------
- name: "KRNL-6000: Reload all sysctl configuration"
  ansible.builtin.command: sysctl --system
  changed_when: true

# -------------------------------------------------------------------------
# Force-set the value directly at runtime as a belt-and-suspenders measure.
# This bypasses all config file ordering issues.
# -------------------------------------------------------------------------
- name: "KRNL-6000: Force-set fs.protected_fifos=2 at runtime"
  ansible.builtin.command: sysctl -w fs.protected_fifos=2
  changed_when: true

# -------------------------------------------------------------------------
# Verify the value took effect. Use a warning instead of a hard failure
# because some kernel builds cap this value at 1 (e.g. certain raspi
# kernels). In that case, we've done everything we can.
# -------------------------------------------------------------------------
- name: "KRNL-6000: Check current fs.protected_fifos value"
  ansible.builtin.command: sysctl -n fs.protected_fifos
  register: fifos_value
  changed_when: false

- name: "KRNL-6000: Warn if fs.protected_fifos could not be set to 2"
  ansible.builtin.debug:
    msg: >
      WARNING: fs.protected_fifos is {{ fifos_value.stdout | trim }}
      instead of 2. This kernel may not support value 2.
      The Lynis KRNL-6000 finding for this parameter will persist but
      cannot be resolved without a kernel upgrade.
  when: fifos_value.stdout | trim != '2'
