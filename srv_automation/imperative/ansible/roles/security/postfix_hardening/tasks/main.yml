---
###############################################################################
# Role: postfix_hardening
# =======================
# Resolves MAIL-8820: "Disable the VRFY command" in Postfix.
#
# The SMTP VRFY command allows remote users to verify whether an email
# address exists on the server, aiding spammers in enumerating accounts.
#
# Guard: only runs if Postfix is installed AND has a valid main.cf.
# Some servers have postconf binary present (pulled as a dependency)
# but Postfix was never initialised, so main.cf doesn't exist.
###############################################################################

# -------------------------------------------------------------------------
# Check if postconf binary exists at all.
# -------------------------------------------------------------------------
- name: "MAIL-8820: Check if postconf binary is available"
  ansible.builtin.command: which postconf
  register: postconf_bin_check
  changed_when: false
  failed_when: false

# -------------------------------------------------------------------------
# Check if Postfix is actually configured (main.cf exists).
# Having the binary alone is not enough — postconf will fail without it.
# -------------------------------------------------------------------------
- name: "MAIL-8820: Check if Postfix main.cf exists"
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: postfix_maincf

# -------------------------------------------------------------------------
# Read current values so we only change settings when needed (idempotent).
# -------------------------------------------------------------------------
- name: "MAIL-8820: Read current disable_vrfy_command value"
  ansible.builtin.command: postconf -n disable_vrfy_command
  register: postfix_disable_vrfy_current
  changed_when: false
  failed_when: false
  when:
    - postconf_bin_check.rc == 0
    - postfix_maincf.stat.exists

- name: "MAIL-8820: Read current smtpd_banner value"
  ansible.builtin.command: postconf -n smtpd_banner
  register: postfix_smtpd_banner_current
  changed_when: false
  failed_when: false
  when:
    - postconf_bin_check.rc == 0
    - postfix_maincf.stat.exists

# -------------------------------------------------------------------------
# Disable the VRFY command. Only run when both binary AND config exist.
# -------------------------------------------------------------------------
- name: "MAIL-8820: Disable SMTP VRFY command in Postfix"
  ansible.builtin.command: postconf -e disable_vrfy_command=yes
  when:
    - postconf_bin_check.rc == 0
    - postfix_maincf.stat.exists
    - postfix_disable_vrfy_current.stdout | default('') | trim != 'disable_vrfy_command = yes'
  changed_when: true
  notify: Reload postfix

# -------------------------------------------------------------------------
# Hide Postfix version in SMTP banner to prevent fingerprinting.
# -------------------------------------------------------------------------
- name: "MAIL-8820: Hide Postfix version in SMTP banner"
  ansible.builtin.command: postconf -e smtpd_banner='$myhostname ESMTP'
  when:
    - postconf_bin_check.rc == 0
    - postfix_maincf.stat.exists
    - postfix_smtpd_banner_current.stdout | default('') | trim != "smtpd_banner = $myhostname ESMTP"
  changed_when: true
  notify: Reload postfix
