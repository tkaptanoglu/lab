---
# ════════════════════════════════════════════════════════════════════
# Prerequisites: ensure node_exporter is present and recent enough
# ════════════════════════════════════════════════════════════════════

# ── Detect current state ───────────────────────────────────────────

- name: Check if node_exporter binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: _ne_binary

- name: Get installed node_exporter version
  ansible.builtin.command:
    cmd: /usr/local/bin/node_exporter --version
  register: _ne_version_output
  changed_when: false
  failed_when: false
  when: _ne_binary.stat.exists

- name: Parse installed node_exporter version
  ansible.builtin.set_fact:
    _ne_installed_version: >-
      {{ _ne_version_output.stderr | default('')
         | regex_search('version\s+([0-9]+\.[0-9]+\.[0-9]+)', '\1')
         | default(['0.0.0'], true) | first }}
  when: _ne_binary.stat.exists

- name: Determine if node_exporter needs install or upgrade
  ansible.builtin.set_fact:
    _ne_needs_install: >-
      {{ (not _ne_binary.stat.exists) or
         (_ne_installed_version is version(node_exporter_min_version, '<')) }}

- name: Show node_exporter status
  ansible.builtin.debug:
    msg: >-
      node_exporter installed: {{ _ne_binary.stat.exists }},
      version: {{ _ne_installed_version | default('N/A') }},
      needs install/upgrade: {{ _ne_needs_install }}

# ── Install / upgrade node_exporter ────────────────────────────────

- name: Determine architecture string for download
  ansible.builtin.set_fact:
    _ne_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'armv7' if ansible_architecture == 'armv7l' else 'amd64' }}"

- name: Download node_exporter {{ node_exporter_version }}
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ _ne_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: "0644"
  when: _ne_needs_install | bool

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: _ne_needs_install | bool

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ _ne_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: _ne_needs_install | bool
  notify: restart node_exporter

- name: Clean up node_exporter download artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ _ne_arch }}"
  when: _ne_needs_install | bool

# ── Ensure node_exporter user exists ───────────────────────────────

- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# ── Ensure textfile collector directory exists ─────────────────────

- name: Create textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# ── Deploy node_exporter systemd unit ──────────────────────────────

- name: Deploy node_exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
