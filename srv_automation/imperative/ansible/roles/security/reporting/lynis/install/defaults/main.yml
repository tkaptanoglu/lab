---
# ── Lynis ──────────────────────────────────────────────────────────
# Git ref to checkout (tag, branch, or commit SHA).
# Pin to a release tag for reproducibility.
lynis_version: "3.1.3"
lynis_install_dir: "/opt/lynis"
lynis_report_dat: "/var/log/lynis-report.dat"
lynis_log_file: "/var/log/lynis.log"

# ── node_exporter ──────────────────────────────────────────────────
# Minimum acceptable version. If the installed version is older,
# the role will upgrade to node_exporter_version.
node_exporter_min_version: "1.7.0"
node_exporter_version: "1.8.2"

# Directory where node_exporter reads .prom textfiles.
# Must match the --collector.textfile.directory flag on node_exporter.
node_exporter_textfile_dir: "/var/lib/node_exporter/textfile_collector"

# ── Cron schedule ──────────────────────────────────────────────────
lynis_cron_minute: "30"
lynis_cron_hour: "4"

# ── Log shipping ──────────────────────────────────────────────────
# Base directory on the shared external drive.
lynis_log_dest_base: "/mnt/external/srv_logs/security/lynis"
