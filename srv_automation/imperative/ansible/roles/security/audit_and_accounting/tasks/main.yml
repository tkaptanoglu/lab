---
###############################################################################
# Role: audit_and_accounting
# ==========================
# Installs and configures auditd, process accounting (acct), and sysstat
# for comprehensive system auditing and performance accounting.
#
# Lynis IDs addressed: ACCT-9628, ACCT-9622, ACCT-9626
###############################################################################

# -------------------------------------------------------------------------
# ACCT-9628: auditd is the Linux audit daemon. It writes detailed audit
# records to disk covering syscalls, file access, auth events, etc.
# -------------------------------------------------------------------------
- name: "ACCT-9628: Install auditd and plugins"
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present

- name: "ACCT-9628: Enable and start auditd service"
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true

# -------------------------------------------------------------------------
# Deploy a comprehensive audit ruleset. This covers:
#   - Identity file changes (passwd, shadow, group)
#   - PAM and login configuration
#   - Cron and scheduled task tampering
#   - Network configuration changes
#   - Kernel module loading (rootkit detection)
#   - System time changes (forensic timeline integrity)
#   - Sudo / privilege escalation config
#   - SSH config changes
# The final "-e 2" makes rules immutable until next reboot.
# -------------------------------------------------------------------------
- name: "ACCT-9628: Deploy comprehensive audit rules"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/lynis-hardening.rules
    content: |
      # Lynis Hardening – Audit Rules
      # Delete all existing rules before loading (clean slate)
      -D
      # Set audit backlog buffer size (prevent lost events under load)
      -b 8192

      # ---- Identity and Authentication ----
      -w /etc/passwd -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/security/opasswd -p wa -k identity

      # ---- PAM Configuration ----
      -w /etc/pam.d/ -p wa -k pam_config

      # ---- Login Configuration ----
      -w /etc/login.defs -p wa -k login_config
      -w /etc/securetty -p wa -k login_config

      # ---- Cron and Scheduled Tasks ----
      -w /etc/crontab -p wa -k cron
      -w /etc/cron.d/ -p wa -k cron
      -w /etc/cron.daily/ -p wa -k cron
      -w /etc/cron.hourly/ -p wa -k cron
      -w /etc/cron.weekly/ -p wa -k cron
      -w /etc/cron.monthly/ -p wa -k cron
      -w /var/spool/cron/ -p wa -k cron

      # ---- Network Configuration ----
      -w /etc/hosts -p wa -k network_config
      -w /etc/network/ -p wa -k network_config
      -w /etc/sysctl.conf -p wa -k sysctl
      -w /etc/sysctl.d/ -p wa -k sysctl

      # ---- Kernel Module Loading ----
      -w /sbin/insmod -p x -k modules
      -w /sbin/modprobe -p x -k modules
      -w /sbin/rmmod -p x -k modules

      # ---- System Time Changes ----
      -a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time_change
      -a always,exit -F arch=b64 -S clock_settime -k time_change
      -w /etc/localtime -p wa -k time_change

      # ---- Sudo and Privilege Escalation ----
      -w /etc/sudoers -p wa -k sudoers
      -w /etc/sudoers.d/ -p wa -k sudoers

      # ---- SSH Configuration ----
      -w /etc/ssh/sshd_config -p wa -k sshd_config

      # Make rules immutable until next reboot (must be last)
      -e 2
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd

# -------------------------------------------------------------------------
# ACCT-9622: acct (process accounting) logs every command executed,
# who ran it, and the resources used. Essential for forensics.
# -------------------------------------------------------------------------
- name: "ACCT-9622: Install acct for process accounting"
  ansible.builtin.apt:
    name: acct
    state: present

- name: "ACCT-9622: Enable and start process accounting service"
  ansible.builtin.systemd:
    name: acct
    state: started
    enabled: true

# -------------------------------------------------------------------------
# ACCT-9626: sysstat (sar, iostat, mpstat) collects system performance
# and accounting data periodically via cron.
# -------------------------------------------------------------------------
- name: "ACCT-9626: Install sysstat for system accounting and statistics"
  ansible.builtin.apt:
    name: sysstat
    state: present

# The default Ubuntu config ships with ENABLED="false"; turn it on.
- name: "ACCT-9626: Enable sysstat data collection"
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
  notify: Restart sysstat
